# Netlify — monorepo: install at the root (npm workspaces), build/serve apps/web.
# In the Netlify UI leave "Base directory" empty; "Package directory" = apps/web is set here.
[build]
  command = "npm run build -w @suqa/web"
  publish = "apps/web/.next"
  package = "apps/web"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (CSP is deliberately left out until Leaflet/unpkg and Supabase origins are finalised).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
