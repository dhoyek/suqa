# Netlify — monorepo: install at the root (npm workspaces), build/serve apps/web.
# In the Netlify UI leave "Base directory" empty; "Package directory" = apps/web is set here.
[build]
  command = "npm test && npm run build -w @suqa/web"   # unit tests gate every deploy
  publish = "apps/web/.next"
  package = "apps/web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"   # warm.mts (scheduled keep-warm); the Next.js handler is added by the plugin

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers are set in apps/web/next.config.ts (Netlify [[headers]] only cover static assets).
